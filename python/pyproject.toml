[project]
name = "beon-python-interview"
version = "0.1.0"
description = "FastAPI async REST boilerplate for interview demo"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "chromadb>=1.5.9",
    "fastapi[standard]>=0.162.0",
    "openai>=3.41.0",
    "sentence-transformers>=6.2.0",
]

[dependency-groups]
dev = [
    "debugpy>=1.8.22",
    "httpx>=0.28.1",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1",
]

[tool.pytest.ini_options]
# Treat `async def test_*` as asyncio tests without per-test decorators.
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
# Make `from src.rest...` importable when running pytest from the project root.
pythonpath = ["."]
testpaths = ["src"]

[tool.uv]
package = false
